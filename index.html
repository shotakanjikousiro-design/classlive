<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b4cca">
<title>ClassLive 授業ライブ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f6fb; --surface:#fff; --surface2:#fafbff; --ink:#1b1d2a; --muted:#646a85; --line:#e2e5ef;
  --primary:#3b4cca; --primary-ink:#fff; --soft:#eceffd; --accent:#f5a524; --ok:#1f9d6a; --bad:#d64545;
  --shadow:0 1px 2px rgba(20,24,60,.06),0 4px 16px rgba(20,24,60,.06);
  --radius:14px;
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  color:var(--ink); background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10121a; --surface:#191c27; --surface2:#1e2130; --ink:#eceef6; --muted:#9aa0b8; --line:#2b2f40;
  --primary:#7d8bff; --primary-ink:#0e1030; --soft:#23273a; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;line-height:1.3;transition:transform .05s,background .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.on{background:var(--soft);border-color:var(--primary);color:var(--primary);font-weight:600}
button.danger{color:var(--bad)}
button.big{padding:14px 20px;font-size:1.05rem;border-radius:12px}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
label{font-size:.85rem;color:var(--muted);display:block;margin:10px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hide{display:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--soft);font-size:.8rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#1b1d2a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:12px;padding:10px 14px;font-size:.85rem}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,25,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.qr svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}

/* ---------- Home ---------- */
.home{max-width:760px;margin:0 auto;padding:28px 16px 60px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand h1{font-size:1.5rem;margin:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:var(--surface2)}
.drop.over{border-color:var(--primary);background:var(--soft)}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress>div{height:100%;background:var(--primary);width:0;transition:width .2s}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.features div{font-size:.85rem;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}

/* ---------- Teacher console ---------- */
.tc{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.tc header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.tc header h2{font-size:1rem;margin:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc main{display:grid;grid-template-columns:1fr 380px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;padding:14px;gap:10px;overflow:auto}
.slidebox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:62vh;display:flex;align-items:center;justify-content:center}
.slidebox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slidebox .ph{color:#888}
.navrow{display:flex;gap:10px;align-items:center}
.navrow .cnt{font-weight:700;min-width:80px;text-align:center}
.nextprev{display:flex;gap:12px;align-items:flex-start}
.nextprev img{width:180px;border-radius:8px;border:1px solid var(--line)}
.film{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.film button{padding:0;border:2px solid transparent;border-radius:8px;flex:0 0 auto;position:relative;background:#000;overflow:hidden}
.film button.cur{border-color:var(--primary)}
.film img{width:120px;display:block}
.film span{position:absolute;left:4px;bottom:2px;font-size:.7rem;color:#fff;text-shadow:0 0 3px #000}
.meter{display:flex;gap:6px;flex-wrap:wrap}
.meter .pill{font-size:.85rem;background:var(--surface);border:1px solid var(--line)}
.meter .pill.warn{background:color-mix(in srgb,var(--bad) 15%,var(--surface));border-color:var(--bad);color:var(--bad);font-weight:700}
aside.side{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:12px 2px;font-size:.8rem;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.cur{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
.panel{padding:14px;overflow:auto;flex:1}
.callcard{border-radius:12px;padding:14px;background:var(--soft);margin:12px 0;text-align:center}
.callcard .nm{font-size:1.6rem;font-weight:800;margin:4px 0}
.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:700;background:var(--surface)}
.status.ok{color:var(--ok)} .status.dunno{color:var(--bad)} .status.think{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.88rem}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done{opacity:.5}
.bar{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:5px 0;padding:7px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.bar i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--primary) 22%,transparent);z-index:0;transition:width .3s}
.bar.correct i{background:color-mix(in srgb,var(--ok) 35%,transparent)}
.bar.correct{border-color:var(--ok);font-weight:700}
.bar span{position:relative;z-index:1}
.opts input{margin-bottom:6px}
.sec{font-weight:700;margin:16px 0 6px;font-size:.92rem}
.timerchip{font-variant-numeric:tabular-nums;font-weight:800}
@media (max-width:900px){
  .tc{height:auto;min-height:100vh}
  .tc main{grid-template-columns:1fr}
  aside.side{border-left:none;border-top:1px solid var(--line)}
  .nextprev img{width:120px}
}

/* ---------- Projector ---------- */
.pj{position:fixed;inset:0;background:#000;color:#fff;overflow:hidden;cursor:default}
.pj .main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pj .main img{max-width:100%;max-height:100%;object-fit:contain}
.pj .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,25,.86);backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pj .qrfull{display:flex;gap:6vw;align-items:center}
.pj .qrfull .qr{width:min(42vh,40vw)}
.pj .qrfull h1{font-size:4.5vh;margin:0 0 2vh}
.pj .qrfull .url{font-size:2.2vh;opacity:.8;word-break:break-all;max-width:40vw}
.pj .qrfull .code{font-size:7vh;margin:2vh 0}
.pj .qrmini{position:absolute;right:16px;bottom:16px;width:15vh;background:#fff;padding:6px;border-radius:10px;color:#000;text-align:center;font-size:1.4vh;font-weight:700}
.pj .timer{position:absolute;top:16px;right:20px;font-size:7vh;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.65);padding:.5vh 2.5vh;border-radius:2vh}
.pj .timer.low{color:#ff6b6b}
.pj .call{text-align:center}
.pj .call .lbl{font-size:3.4vh;opacity:.8;letter-spacing:.2em}
.pj .call .nm{font-size:14vh;font-weight:900;margin:2vh 0;min-height:16vh}
.pj .call.landed .nm{color:#ffd166;text-shadow:0 0 40px rgba(255,209,102,.6);animation:land .5s}
@keyframes land{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pj .call .q{font-size:4vh;max-width:80vw;margin:0 auto}
.pj .call .cst{font-size:3.5vh;margin-top:3vh}
.pj .poll{width:min(1100px,86vw)}
.pj .poll h2{font-size:4.6vh;margin:0 0 3vh}
.pj .poll .bar{border-color:rgba(255,255,255,.25);font-size:3.6vh;padding:1.6vh 2vh;margin:1.2vh 0}
.pj .poll .bar i{background:rgba(125,139,255,.45)}
.pj .poll .bar.correct{border-color:#3ddc97}
.pj .poll .bar.correct i{background:rgba(61,220,151,.45)}
.pj .poll .meta{font-size:2.6vh;opacity:.75}
.pj .qa{max-width:80vw;font-size:6vh;text-align:center;line-height:1.5}
.pj .tools{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;opacity:0;transition:opacity .3s}
.pj:hover .tools{opacity:1}
.pj .tools button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.pj .count{position:absolute;left:16px;top:14px;font-size:2vh;opacity:.6}

/* ---------- Student ---------- */
.st{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.st header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.st header .ttl{font-weight:700;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st .body{flex:1;padding:12px 12px 90px}
.st .slide{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.st .slide img{width:100%;height:100%;object-fit:contain}
.st .slide .ph{color:#888;font-size:.9rem}
.st .live-back{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--accent);color:#1b1d2a;border:none;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.st .snav{display:flex;align-items:center;justify-content:space-between;margin:8px 2px}
.react{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.react button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:.75rem}
.react button b{font-size:1.3rem}
.st nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.st nav.bottom div{display:flex;max-width:760px;width:100%}
.st nav.bottom button{flex:1;border:none;border-radius:0;background:transparent;padding:10px 4px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.st nav.bottom button b{font-size:1.2rem}
.st nav.bottom button.cur{color:var(--primary);font-weight:700}
.join{max-width:440px;margin:0 auto;padding:40px 18px}
.alert-call{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#ffb020,#ff6a3d);color:#1b1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fade .25s}
.alert-call .ring{font-size:5rem;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(12deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(0)}}
.alert-call h1{font-size:1.9rem;margin:10px 0}
.alert-call .q{background:rgba(255,255,255,.55);border-radius:12px;padding:12px 16px;font-size:1.1rem;max-width:520px;margin:6px 0 20px}
.alert-call .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.alert-call button{border:none;padding:16px;font-size:1.1rem;font-weight:700;border-radius:14px;background:#fff;color:#1b1000}
.alert-call button.go{background:#1b1d2a;color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;font-size:1.05rem;border-radius:12px}
.sheet .opt.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.sheet .opt.correct{border:2px solid var(--ok)}
.mini-banner{position:fixed;left:12px;right:12px;bottom:76px;z-index:40;background:var(--primary);color:var(--primary-ink);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);max-width:736px;margin:0 auto}
.mini-banner.amber{background:var(--accent);color:#1b1000}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.interim{color:var(--muted);font-size:.9rem;min-height:1.3em;margin:6px 0;font-style:italic}
.oqq{font-size:1.15rem;font-weight:700;background:var(--soft);border-radius:12px;padding:12px 14px;margin:8px 0 10px;line-height:1.5}
.ans .who{font-size:.75rem;color:var(--muted)}
.pj .oq{width:min(1300px,90vw);text-align:center}
.pj .oq .lbl{font-size:3vh;opacity:.7;margin-bottom:2vh}
.pj .oq h2{font-size:5.4vh;margin:0 0 2vh;line-height:1.4}
.pj .oq .meta{font-size:2.8vh;opacity:.75}
.pj .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(24vw,1fr));gap:1.4vh;max-height:58vh;overflow:hidden;margin-top:3vh;text-align:left}
.pj .wall div{background:rgba(255,255,255,.1);border-radius:1.2vh;padding:1.4vh 1.8vh;font-size:2.5vh;line-height:1.4;animation:fade .4s}
.pj .pick{font-size:6vh;line-height:1.5;max-width:80vw;margin:0 auto;font-weight:700}
.mini-banner.second{bottom:136px}
label.row{display:flex}
#gemKey{flex:1;min-width:0}
button{white-space:nowrap}
.lvl{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.lvl.low i{background:var(--accent)}
details.set{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface2)}
details.set summary{cursor:pointer;font-size:.88rem;font-weight:600}
.mbar{display:none}
@media (max-width:900px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
  .mbar button{flex:1;padding:14px 4px;font-size:1rem;font-weight:700}
  .mbar button.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
  .tc{padding-bottom:84px}
  .tc header .hide-m{display:none}
  .stage .film,.stage .nextprev,.stage .shortcut{display:none}
  .slidebox{max-height:32vh}
}
.headtimer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--accent);color:#1b1000;border-radius:8px;padding:2px 8px}
</style>
</head>

const LIB = {

/* ============================ Utilities ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function rid(n = 10, abc = "abcdefghijkmnopqrstuvwxyz23456789") {
  const a = crypto.getRandomValues(new Uint32Array(n)); let s = "";
  for (const x of a) s += abc[x % abc.length]; return s;
}
function randInt(n) { return crypto.getRandomValues(new Uint32Array(1))[0] % n; }
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function toast(msg, ms = 2600) { const d = document.createElement("div"); d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), ms); }
const loaded = {};
function loadScript(src) {
  return loaded[src] ||= new Promise((ok, ng) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ng(new Error("読み込み失敗: " + src)); document.head.appendChild(s); });

function googleToken() {

  return loadScript(LIB.gis).then(() => new Promise((ok, ng) => {
    const tc = google.accounts.oauth2.initTokenClient({

      callback: r => { if (r.error) { const e = new Error(r.error_description || r.error); e.code = "cancel"; ng(e); } else { gToken = { t: r.access_token, exp: Date.now() + (r.expires_in || 3600) * 1000 }; ok(gToken.t); } },
      error_callback: r => { const e = new Error(r.message || r.type || "ログインできませんでした"); e.code = r.type === "popup_closed" ? "cancel" : "popup"; ng(e); },

async function pptxViaGoogle(file, prog) {

async function pptxInBrowser(file, onProg) {
  await loadScript(LIB.pptx); await loadScript(LIB.h2i);
  const buf = await file.arrayBuffer();
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-20000px;top:0;background:#fff";
  document.body.appendChild(host);
  try {
    const probe = pptxPreview.init(host, { width: 960, height: 540, mode: "slide" });
    const meta = await probe.load(buf.slice(0));
    const ratio = meta && meta.width && meta.height ? meta.height / meta.width : 9 / 16;
    probe.destroy && probe.destroy(); host.innerHTML = "";
    const W = 960, Hh = Math.round(W * ratio); // ライブラリの標準サイズで描画し、書き出し時に拡大
    host.style.width = W + "px"; host.style.height = Hh + "px";
    const pv = pptxPreview.init(host, { width: W, height: Hh, mode: "slide" });
    await pv.load(buf);
    const n = pv.slideCount, out = [];
    for (let i = 0; i < n; i++) {
      onProg(i + 1, n);
      if (i > 0) pv.removeCurrentSlide();
      pv.renderSingleSlide(i);
      await new Promise(r => setTimeout(r, 250));
      await document.fonts?.ready;
      const el = host.querySelector(".pptx-preview-slide-wrapper") || host;
      out.push(await htmlToImage.toJpeg(el, { quality: .85, pixelRatio: 1600 / W, backgroundColor: "#fff", width: W, height: Hh }));
    }
    return out;
  } finally { host.remove(); }
}

      return `<div class="item"><span class="small muted">${fmtTime(p.at)}</span><div class="t">${esc(p.q || `スライド${(p.slide || 0) + 1}の問題（${p.options.length}択）`)}<div class="small muted">${t.total}人回答 ${rate}</div></div>${pid === id ? `<span class="pill">表示中</span>` : `<button data-reshow="${pid}">再表示</button>`}</div>`;

    const s = T.state.slide || 0;

    $("#pplList").innerHTML = all.length ? all.map(([id, p]) => {
      const r = p.react && p.react.s === s ? REACTS.find(x => x.k === p.react.t)?.e || "" : "";
      return `<div class="item"><span class="dot ${isOnline(p) ? "live" : ""}"></span><div class="t"><b>${esc(p.name)}</b> <span class="small muted">${esc(p.num || "")}</span></div>
      <span>${r}</span><span class="small muted">指名${callN[id] || 0}</span><button data-pick="${id}" ${isOnline(p) ? "" : "disabled"}>指名</button></div>`;
    }).join("") : `<div class="small muted" style="margin-top:10px">まだ誰も参加していません。「QR全画面」で参加用QRを投影しましょう。</div>`;
    $$("[data-pick]").forEach(b => b.onclick = () => randomCall(b.dataset.pick));

  $("#csv").onclick = () => {
    const polls = Object.entries(T.polls).sort((a, b) => a[1].at - b[1].at);

    const head = ["名前", "学籍番号", "参加時刻", "最終状態", "指名回数", "指名への返答", "投票回答数", "正解数", "口頭質問への回答数", ...polls.map(([, p], i) => `Q${i + 1}${p.q ? ":" + p.q : ""}`), ...oqs.map(([, q], i) => `口頭${i + 1}:${q.text}`)];

      const per = polls.map(([pid, pl]) => { const a = (T.answers[pid] || {})[id]; if (!a) return ""; ans++; const corr = pl.correct >= 0 && a.c === pl.correct; if (corr) ok++; return pl.options[a.c] + (pl.correct >= 0 ? (corr ? "(○)" : "(×)") : ""); });
      const oper = oqs.map(([qid]) => ((T.oans[qid] || {})[id] || {}).text || "");
      return [p.name, p.num || "", new Date(p.joinedAt).toLocaleString("ja-JP"), isOnline(p) ? "オンライン" : "退出", cs.length, cs.map(c => (CALL_ST[c.status] || CALL_ST.pending)[0]).join(" / "), ans, ok, oper.filter(Boolean).length, ...per, ...oper];
    });
    const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    download(`${T.meta.title}_${new Date().toISOString().slice(0, 10)}.csv`, "﻿" + csv, "text/csv");
  };

  /* ---- subscriptions ---- */
  DB.on(P + "/meta", v => { if (v) T.meta = v; });
  DB.on(P + "/state", v => {
    T.state = v || {}; renderStage(); renderCall(); renderPoll(); renderQA(); renderOQ();
    $("#btnQR").classList.toggle("on", !!T.state.showQR); $("#btnQRmini").classList.toggle("on", !!T.state.qrCorner);

  DB.on(P + "/participants", v => { T.parts = v || {}; renderPeople(); renderMeter(); renderCall(); renderPoll(); });
  DB.on(P + "/calls", v => { T.calls = v || {}; renderCall(); renderPeople(); });
  DB.on(P + "/polls", v => { T.polls = v || {}; renderPoll(); });
  DB.on(P + "/answers", v => { T.answers = v || {}; renderPoll(); });
  DB.on(P + "/oqs", v => { T.oqs = v || {}; renderOQ(); });
  DB.on(P + "/oans", v => { T.oans = v || {}; renderOQ(); });
  let qsLoaded = false;
  DB.on(P + "/questions", v => { const before = Object.keys(T.qs).length; T.qs = v || {}; renderQA(); if (qsLoaded && Object.keys(T.qs).length > before && T.tab !== "qa") toast("🙋 新しい質問が届きました"); qsLoaded = true; });
  setInterval(() => { renderPeople(); renderMeter(); }, 10000);
}
function modal(html) {
  const bg = document.createElement("div"); bg.className = "modal-bg";

/* ============================ Projector ============================ */
async function projectorPage(code, key) {
  const P = SP(code);
  const meta = await DB.get(P + "/meta");
  if (!meta || meta.keyHash !== hash(key)) return badKey();
  document.title = "投影 | " + meta.title;
  const V = { state: {}, parts: {}, call: null, poll: null, answers: {}, qa: null, oq: null, oans: {}, rolled: {}, unsub: {} };
  const ctrl = makeCtrl(code, () => V.state, () => meta);
  const url = joinUrl(code);
  const qr = await qrSvg(url);
  app.innerHTML = `<div class="pj" id="pj">
    <div class="main" id="pjMain"></div>
    <div id="pjOv"></div>
    <div class="qrmini hide" id="pjMini"><div class="qr">${qr}</div>コード ${code}</div>
    <div class="timer hide" id="pjTimer"></div>
    <div class="count" id="pjCount"></div>

  </div>`;
  unlockAudio(); addEventListener("pointerdown", unlockAudio, { once: true });
  $("#fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  $("#pp").onclick = () => ctrl.prev(); $("#nn").onclick = () => ctrl.next();
  keyNav(ctrl, { f: () => $("#fs").click(), q: () => ctrl.st({ showQR: !V.state.showQR }), escape: () => ctrl.st({ overlay: null, showQR: false }) });

  let shown = -1;
  async function renderSlide() {
    const s = V.state.slide || 0; if (s === shown) return; shown = s;
    const u = await getSlide(code, s); if (s !== (V.state.slide || 0)) return;
    $("#pjMain").innerHTML = u ? `<img src="${u}" alt="">` : "";
    if (s + 1 < meta.slideCount) getSlide(code, s + 1);
  }
  const onlineNames = () => Object.values(V.parts).filter(isOnline).map(p => p.name);
  function renderOv() {
    const st = V.state, ov = $("#pjOv");
    const n = onlineNames().length;
    $("#pjCount").textContent = `👥 ${n}人 参加中`;
    if (st.showQR) {
      const pr = joinProblems();
      if (pr.length) {
        if (ov.dataset.k !== "qrng") { ov.dataset.k = "qrng"; ov.innerHTML = `<div class="ov"><div style="max-width:min(1100px,86vw);font-size:3vh;line-height:1.7"><h1 style="font-size:4.6vh;margin:0 0 2vh">⚠ まだ学生のスマホからは参加できません</h1><div style="opacity:.85;margin-bottom:2vh">このままQRコードを出しても、スマホでは「使用可能なデータがありません」になります。</div><ul style="padding-left:4vh">${pr.map(x => `<li>${esc(x)}</li>`).join("")}</ul><div style="opacity:.7;font-size:2.4vh;margin-top:2vh">いまのアドレス：${esc(location.href.slice(0, 90))}…</div><div style="opacity:.7;font-size:2.4vh">（Q キー または Esc でこの表示を閉じる）</div></div></div>`; }
        return;
      }
      if (ov.dataset.k !== "qr") { ov.dataset.k = "qr"; ov.innerHTML = `<div class="ov"><div class="qrfull"><div class="qr">${qr}</div><div><h1>📱 スマホで参加しよう</h1><div>カメラでQRを読み取ってください</div><div class="code">${code}</div><div class="url">${esc(url)}</div><div style="margin-top:3vh;font-size:3vh" id="pjQRn"></div></div></div></div>`; }
      $("#pjQRn").textContent = `👥 ${n}人 参加中`;
      return;
    }
    if (st.overlay === "call" && V.call) {
      const c = V.call, k = "call:" + st.callId;
      if (ov.dataset.k !== k) {
        ov.dataset.k = k;
        ov.innerHTML = `<div class="ov"><div class="call" id="pjCall"><div class="lbl">🎯 指名</div><div class="nm" id="pjName"></div><div class="q">${c.q ? "「" + esc(c.q) + "」" : ""}</div><div class="cst" id="pjSt"></div></div></div>`;
        const fresh = DB.now() - c.at < 8000 && !V.rolled[st.callId];
        V.rolled[st.callId] = true;
        if (fresh) roulette(c.name); else { $("#pjName").textContent = c.name + " さん"; $("#pjCall").classList.add("landed"); }
      }
      const s = CALL_ST[c.status]; $("#pjSt").textContent = c.status !== "pending" && $("#pjCall").classList.contains("landed") ? s[0] : "";
      return;
    }
    if (st.overlay === "poll" && V.poll) {
      const p = V.poll, a = V.answers || {};
      const cnt = p.options.map(() => 0); for (const v of Object.values(a)) if (cnt[v.c] != null) cnt[v.c]++;
      const total = Object.keys(a).length;
      ov.dataset.k = "poll";
      ov.innerHTML = `<div class="ov"><div class="poll"><h2>📊 ${esc(p.q || "スライドの問題にスマホで回答してください")}</h2>
        ${p.options.map((o, i) => { const pct = total ? Math.round(cnt[i] / total * 100) : 0; const ok = p.showCorrect && p.correct === i;
          return `<div class="bar ${ok ? "correct" : ""}"><i style="width:${p.showResults ? pct : 0}%"></i><span>${ok ? "✅ " : ""}${p.options.length > 2 && !/^[A-Z0-9]$/.test(o) ? OPT_LABELS[i] + ". " : ""}${esc(o)}</span><span>${p.showResults ? `${cnt[i]}人 ${pct}%` : ""}</span></div>`; }).join("")}
        <div class="meta">回答 ${total} / ${n}人　${p.open ? "受付中" : "締め切りました"}</div></div></div>`;
      return;
    }
    if (st.overlay === "oq" && V.oq) {
      const ans = Object.entries(V.oans || {}).sort((a, b) => a[1].at - b[1].at);
      ov.dataset.k = "oq";
      if (st.oqPick && V.oans[st.oqPick]) {
        ov.innerHTML = `<div class="ov"><div class="oq"><div class="lbl">💬 みんなの回答から</div><div style="font-size:2.8vh;opacity:.7;margin-bottom:3vh">Q. ${esc(V.oq.text)}</div><div class="pick">${esc(V.oans[st.oqPick].text)}</div></div></div>`;
      } else {
        ov.innerHTML = `<div class="ov"><div class="oq"><div class="lbl">🎤 先生からの質問 ── スマホで回答してください</div><h2>${esc(V.oq.text)}</h2>
          <div class="meta">回答 ${ans.length} / ${n}人　${V.oq.open ? "受付中" : "締め切りました"}</div>
          ${V.oq.showAnswers ? `<div class="wall">${ans.slice(-24).map(([, a]) => `<div>${esc(a.text)}</div>`).join("")}</div>` : ""}</div></div>`;
      }
      return;
    }
    if (st.overlay === "qa" && V.qa) {
      ov.dataset.k = "qa";
      ov.innerHTML = `<div class="ov"><div><div style="text-align:center;font-size:3vh;opacity:.7;margin-bottom:3vh">🙋 学生からの質問　▲${Object.keys(V.qa.votes || {}).length}</div><div class="qa">${esc(V.qa.text)}</div></div></div>`;
      return;
    }
    ov.dataset.k = ""; ov.innerHTML = "";
  }
  function roulette(final) {
    let names = onlineNames(); if (names.length < 2) names = [final, "？？？"];
    const el = $("#pjName"); let i = 0, delay = 50; const t0 = performance.now();
    const step = () => {
      if (!el.isConnected) return;
      const el2 = performance.now() - t0;
      if (el2 > 2600) { el.textContent = final + " さん"; $("#pjCall").classList.add("landed"); chime("call"); renderOv(); return; }
      el.textContent = names[(i++ + randInt(names.length)) % names.length];
      delay = 50 + Math.pow(el2 / 2600, 3) * 320; setTimeout(step, delay);
    };

  }
  function sub(name, path, cb) { V.unsub[name]?.(); V.unsub[name] = path ? DB.on(path, cb) : null; if (!path) cb(null); }
  let lastCall, lastPoll, lastQa, lastOq, timerEnded = {};
  DB.on(P + "/state", v => {
    V.state = v || {}; renderSlide();

    if (V.state.pollId !== lastPoll) { lastPoll = V.state.pollId; sub("poll", lastPoll && `${P}/polls/${lastPoll}`, p => { V.poll = p; renderOv(); }); sub("ans", lastPoll && `${P}/answers/${lastPoll}`, a => { V.answers = a || {}; renderOv(); }); }
    if (V.state.oqId !== lastOq) { lastOq = V.state.oqId; sub("oq", lastOq && `${P}/oqs/${lastOq}`, q => { V.oq = q; renderOv(); }); sub("oans", lastOq && `${P}/oans/${lastOq}`, a => { V.oans = a || {}; renderOv(); }); }
    if (V.state.qaId !== lastQa) { lastQa = V.state.qaId; sub("qa", lastQa && `${P}/questions/${lastQa}`, q => { V.qa = q; renderOv(); }); }
    $("#pjMini").classList.toggle("hide", !V.state.qrCorner || !!V.state.showQR);
    renderOv();

  setInterval(() => {
    const t = V.state.timer, el = $("#pjTimer");

    el.classList.toggle("low", left < 10000);
    if (left <= 0 && !timerEnded[t.end]) { timerEnded[t.end] = 1; chime("end"); }
  }, 200);
}

      <div class="body">
        <div data-v="slide">
          <div class="slide" id="sl"><span class="ph">先生の操作を待っています…</span></div>
          <div class="snav"><button id="sp">◀</button><span class="small muted" id="sc"></span><button id="sn">▶</button></div>
          <div class="small muted" style="margin:2px 2px 4px">このスライドの理解度を先生に伝える</div>
          <div class="react" id="react"></div>
          <div id="notifHint"></div>
        </div>
        <div data-v="qa" class="hide">
          <div class="card">
            <b>先生に質問する</b>
            <textarea id="qText" rows="3" maxlength="200" placeholder="わからなかったことを気軽にどうぞ" style="margin-top:8px"></textarea>
            <div class="row" style="margin-top:8px"><label class="row grow" style="margin:0;color:var(--ink);gap:6px"><input type="checkbox" id="qName"> 名前を表示する</label><button class="primary" id="qSend">送信</button></div>
            <div class="small muted" style="margin-top:6px">チェックしなければ匿名で送られます。いいね（▲）が多い質問が上に並びます。</div>
          </div>
          <div class="list" id="qList" style="margin-top:12px"></div>
        </div>
        <div data-v="memo" class="hide">
          <div class="card">
            <b id="memoTitle">メモ</b>
            <textarea id="memo" rows="8" placeholder="このスライドについてのメモ（この端末にだけ保存されます）" style="margin-top:8px"></textarea>
            <div class="row" style="margin-top:8px"><span class="small muted grow" id="memoSaved"></span><button id="memoDl">⬇ 全メモを保存</button></div>
          </div>
        </div>
      </div>
      <nav class="bottom"><div>
        <button data-t="slide" class="cur"><b>🖼</b>スライド</button>
        <button data-t="qa"><b>🙋</b>質問</button>
        <button data-t="memo"><b>📝</b>メモ</button>
      </div></nav>
      <div id="sheet"></div><div id="oqSheet"></div><div id="mini"></div><div id="mini2"></div><div id="callAl"></div>
    </div>`;
    DB.presence(`${P}/participants/${me.pid}`);
    DB.onConnection(ok => $("#conn").classList.toggle("live", ok));
    addEventListener("pointerdown", unlockAudio);
    // 画面が消えないように（対応端末のみ）
    let wl = null; const keepAwake = async () => { try { if ("wakeLock" in navigator && document.visibilityState === "visible") wl = await navigator.wakeLock.request("screen"); } catch (e) {} };
    keepAwake(); document.addEventListener("visibilitychange", keepAwake);
    if ("Notification" in window && Notification.permission === "default") {
      $("#notifHint").innerHTML = `<div class="banner" style="margin-top:12px">🔔 指名の通知をオンにすると、画面を見ていなくても気づけます。<button id="nOn" style="margin-left:6px">通知をオン</button></div>`;
      $("#nOn").onclick = async () => { await Notification.requestPermission(); $("#notifHint").innerHTML = ""; };
    }

    /* tabs */
    $$("[data-t]").forEach(b => b.onclick = () => {
      S.tab = b.dataset.t; $$("[data-t]").forEach(x => x.classList.toggle("cur", x === b));
      $$("[data-v]").forEach(v => v.classList.toggle("hide", v.dataset.v !== S.tab));
      if (S.tab === "memo") loadMemo();
    });

    /* slides */
    const cur = () => S.view ?? (S.state.slide || 0);
    let shownSlide = -1;
    async function renderSlide() {
      const live = S.state.slide || 0, max = S.state.maxSlide || 0, s = cur();
      $("#sc").innerHTML = `${s + 1} / ${meta.slideCount}` + (S.view != null ? `（ライブは ${live + 1}）` : ` <span style="color:var(--ok)">● ライブ</span>`);
      $("#sp").disabled = s <= 0; $("#sn").disabled = s >= max;
      if (s !== shownSlide) {
        shownSlide = s;
        const u = await getSlide(code, s); if (s !== cur()) return;
        $("#sl").innerHTML = (u ? `<img src="${u}" alt="スライド${s + 1}">` : `<span class="ph">スライドを読み込めませんでした</span>`) + (S.view != null ? `<button class="live-back" id="lb">● ライブに戻る</button>` : "");
        if ($("#lb")) $("#lb").onclick = () => { S.view = null; renderSlide(); };
        if (S.tab === "memo") loadMemo();
      }
      renderReact();
    }
    const browse = d => { const max = S.state.maxSlide || 0; let n = cur() + d; if (n < 0 || n > max) return; S.view = n === (S.state.slide || 0) ? null : n; renderSlide(); };
    $("#sp").onclick = () => browse(-1); $("#sn").onclick = () => browse(1);
    let tx = null; $("#sl").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
    $("#sl").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) browse(dx < 0 ? 1 : -1); tx = null; });

    /* reactions */
    let myReact = null;
    function renderReact() {
      const live = S.state.slide || 0;
      $("#react").innerHTML = REACTS.map(r => `<button data-r="${r.k}" class="${myReact && myReact.s === live && myReact.t === r.k ? "on" : ""}"><b>${r.e}</b>${r.t}</button>`).join("");
      $$("[data-r]").forEach(b => b.onclick = () => {
        const live = S.state.slide || 0;
        myReact = myReact && myReact.s === live && myReact.t === b.dataset.r ? null : { t: b.dataset.r, s: live, at: DB.now() };
        DB.set(`${P}/participants/${me.pid}/react`, myReact); renderReact();
      });
    }

    /* timer */
    setInterval(() => {
      const t = S.state.timer; const el = $("#hTimer");
      if (!t) { el.innerHTML = ""; return; }
      const left = t.end - DB.now();
      el.innerHTML = left > -10000 ? `<span class="headtimer">⏱ ${left > 0 ? fmtSec(left) : "終了"}</span>` : "";
    }, 250);

    /* call */
    let flashT = 0;
    function onCall(id, c) {
      if (!c) { $("#callAl").innerHTML = ""; return; }
      if (c.pid !== me.pid) {
        $("#callAl").innerHTML = "";
        if (!S.alerted[id] && DB.now() - c.at < 20000) { S.alerted[id] = 1; setTimeout(() => toast(`🎯 ${c.name} さんが指名されました`), Math.max(0, c.at + 2700 - DB.now())); }
        return;
      }
      if (c.status === "pending") {
        if (DB.now() - c.at > 10 * 60 * 1000) return;
        if (!S.alerted[id]) { S.alerted[id] = 1; setTimeout(() => showCallAlert(id), Math.max(0, Math.min(3000, c.at + 2700 - DB.now()))); }
        else if (!$(".alert-call")) showCallAlert(id);
      } else if (c.status === "think") {
        $("#callAl").innerHTML = `<div class="mini-banner amber"><span>🤔 指名中：考えがまとまったら</span><button id="readyB" style="border:none">✋ 答えます</button></div>`;
        $("#readyB").onclick = () => DB.update(`${P}/calls/${id}`, { status: "ok", respondedAt: DB.now() });
      } else { $("#callAl").innerHTML = ""; stopFlash(); }
    }
    function showCallAlert(id) {
      const c = S.call; if (!c || c.pid !== me.pid || c.status !== "pending" || S.state.callId !== id) return;
      $("#callAl").innerHTML = `<div class="alert-call"><div class="ring">🙋</div><h1>あなたが指名されました！</h1>
        ${c.q ? `<div class="q">${esc(c.q)}</div>` : `<div class="q">先生から質問があります</div>`}
        <div class="btns"><button class="go" data-cs="ok">✋ 答えます</button><button data-cs="think">🤔 少し考えさせてください</button><button data-cs="dunno">🙇 わかりません</button></div></div>`;
      $$("[data-cs]").forEach(b => b.onclick = () => { DB.update(`${P}/calls/${id}`, { status: b.dataset.cs, respondedAt: DB.now() }); stopFlash(); });
      chime("call");
      try { navigator.vibrate?.([400, 150, 400, 150, 800]); } catch (e) {}
      if (document.visibilityState !== "visible") sysNotify("🙋 あなたが指名されました", c.q || "先生から質問があります");
      startFlash();
    }
    const baseTitle = document.title;
    function startFlash() { clearInterval(flashT); let f = 0; flashT = setInterval(() => { document.title = (f++ % 2) ? "🔔 指名されました！" : baseTitle; if (document.visibilityState === "visible" && f > 6) stopFlash(); }, 800); }
    function stopFlash() { clearInterval(flashT); document.title = baseTitle; }

    /* poll */
    function renderPoll() {
      const id = S.state.pollId, p = S.poll;
      if (!id || !p || S.pollHidden[id] || oqVisible()) {
        $("#sheet").innerHTML = "";
        $("#mini").innerHTML = id && p && (p.open || p.showResults) ? `<div class="mini-banner"><span>📊 投票${p.open ? "受付中" : "の結果"}</span><button id="pOpenB" style="border:none">開く</button></div>` : "";
        if ($("#pOpenB")) $("#pOpenB").onclick = () => { delete S.pollHidden[id]; renderPoll(); };
        return;
      }
      $("#mini").innerHTML = "";
      const mine = (S.answers || {})[me.pid];
      const total = Object.keys(S.answers || {}).length;
      const cnt = p.options.map(() => 0); for (const a of Object.values(S.answers || {})) if (cnt[a.c] != null) cnt[a.c]++;
      let verdict = "";
      if (p.showCorrect && p.correct >= 0) verdict = mine ? (mine.c === p.correct ? `<div style="font-size:1.4rem;font-weight:800;color:var(--ok)">⭕ 正解！</div>` : `<div style="font-size:1.4rem;font-weight:800;color:var(--bad)">❌ 不正解</div>`) : `<div class="muted">正解は ${esc(p.options[p.correct])} でした</div>`;
      $("#sheet").innerHTML = `<div class="sheet">
        <div class="row"><b class="grow">📊 ${esc(p.q || "スライドの問題に回答してください")}</b><button class="ghost" id="pHide">最小化</button></div>
        ${verdict}
        ${p.showResults
          ? p.options.map((o, i) => { const pct = total ? Math.round(cnt[i] / total * 100) : 0; const ok = p.showCorrect && p.correct === i;
              return `<div class="bar ${ok ? "correct" : ""}"><i style="width:${pct}%"></i><span>${ok ? "✅ " : ""}${mine && mine.c === i ? "👉 " : ""}${esc(o)}</span><span>${pct}%</span></div>`; }).join("")
          : p.options.map((o, i) => `<button class="opt ${mine && mine.c === i ? "sel" : ""}" data-c="${i}" ${p.open ? "" : "disabled"}>${p.options.length > 2 && !/^[A-Z0-9]$/.test(o) ? OPT_LABELS[i] + ". " : ""}${esc(o)}</button>`).join("")}
        <div class="small muted" style="margin-top:6px">${p.open ? (mine ? "回答しました（締切まで変更できます）" : "タップして回答") : "締め切りました"}</div>
      </div>`;
      $("#pHide").onclick = () => { S.pollHidden[id] = 1; renderPoll(); };
      $$("[data-c]").forEach(b => b.onclick = () => { DB.set(`${P}/answers/${id}/${me.pid}`, { c: +b.dataset.c, at: DB.now() }); try { navigator.vibrate?.(30); } catch (e) {} });
    }

    /* oral question (口頭質問への回答) */
    const SRs = window.SpeechRecognition || window.webkitSpeechRecognition;
    let srec = null, srecOn = false, usedVoice = false;
    function oqVisible() { const id = S.state.oqId; return !!(id && S.oq && !S.oqHidden[id]); }
    function stopDict() { srecOn = false; try { srec && srec.stop(); } catch (e) {} const b = $("#oqMic"); if (b) { b.classList.remove("rec"); b.textContent = "🎤 音声で入力"; } const it = $("#oqInterim"); if (it) it.textContent = ""; }
    function startDict() {
      if (!SRs) return toast("この端末ではキーボードのマイクボタンで音声入力してください", 4000);
      srecOn = true; usedVoice = true; $("#oqMic").classList.add("rec"); $("#oqMic").textContent = "⏹ 入力を止める";
      srec = new SRs(); srec.lang = "ja-JP"; srec.interimResults = true; srec.continuous = true;
      srec.onresult = e => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) { const ta = $("#oqIn"); if (ta) ta.value = (ta.value + r[0].transcript).trim(); } else interim += r[0].transcript;
        }
        const it = $("#oqInterim"); if (it) it.textContent = interim ? "…" + interim : "";
      };
      srec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { toast("マイクが許可されていません。キーボードのマイクボタンでも音声入力できます", 5000); stopDict(); } };
      srec.onend = () => { if (srecOn) { try { srec.start(); } catch (e) {} } };
      try { srec.start(); } catch (e) {}
    }
    function renderOQ() {
      const id = S.state.oqId, q = S.oq, box = $("#oqSheet");
      const mini = $("#mini2");
      if (!id || !q) { if (S.oqBuilt) stopDict(); box.innerHTML = ""; mini.innerHTML = ""; S.oqBuilt = null; renderPoll(); return; }
      // 新しい質問が届いたらお知らせ
      if (!S.oqNotified[id]) {
        S.oqNotified[id] = 1;
        if (q.open && DB.now() - q.at < 120000) { chime("ping"); try { navigator.vibrate?.([200, 100, 200]); } catch (e) {} if (document.visibilityState !== "visible") sysNotify("🎤 先生から質問です", q.text); }
      }
      const mine = (S.oans || {})[me.pid];
      if (S.oqHidden[id]) {
        if (S.oqBuilt) stopDict();
        box.innerHTML = ""; S.oqBuilt = null;
        mini.innerHTML = `<div class="mini-banner amber second"><span>🎤 先生からの質問${q.open ? (mine ? "（回答済み）" : "（未回答）") : ""}</span><button id="oqOpenB" style="border:none">開く</button></div>`;
        $("#oqOpenB").onclick = () => { delete S.oqHidden[id]; renderOQ(); };
        renderPoll(); return;
      }
      mini.innerHTML = "";
      if (S.oqBuilt !== id) {
        S.oqBuilt = id; usedVoice = false;
        box.innerHTML = `<div class="sheet" style="z-index:55">
          <div class="row"><b class="grow">🎤 先生からの質問</b><button class="ghost" id="oqHide">最小化</button></div>
          <div class="oqq">${esc(q.text)}</div>
          <textarea id="oqIn" rows="3" maxlength="300" placeholder="ここに回答を入力（🎤ボタンで話して入力もできます）"></textarea>
          <div class="interim" id="oqInterim"></div>
          <div class="row"><button id="oqMic">🎤 音声で入力</button><span class="grow"></span><button class="primary" id="oqSub">送信</button></div>
          <div class="small muted" id="oqSt" style="margin-top:6px"></div>
          <div id="oqWall"></div>
        </div>`;
        $("#oqIn").value = mine?.text || "";
        $("#oqHide").onclick = () => { S.oqHidden[id] = 1; renderOQ(); };
        $("#oqMic").onclick = () => srecOn ? stopDict() : startDict();
        $("#oqSub").onclick = () => {
          stopDict();
          const text = $("#oqIn").value.trim(); if (!text) return toast("回答を入力してください");
          if (!(S.oq && S.oq.open)) return toast("締め切られています");
          DB.set(`${P}/oans/${id}/${me.pid}`, { text, at: DB.now(), voice: usedVoice });
          toast("回答を送信しました"); try { navigator.vibrate?.(30); } catch (e) {}
        };
        renderPoll();
      }
      // 状態の更新（入力中の文字は消さない）
      const closed = !q.open;
      $("#oqIn").disabled = closed; $("#oqMic").disabled = closed; $("#oqSub").disabled = closed;
      if (closed) stopDict();
      $("#oqSub").textContent = mine ? "修正して送信" : "送信";
      $("#oqSt").textContent = closed ? (mine ? "締め切りました（あなたの回答は届いています）" : "締め切りました") : (mine ? "✅ 送信済み。締切までは修正できます" : "回答して「送信」を押してください");
      const all = Object.entries(S.oans || {}).sort((a, b) => a[1].at - b[1].at);
      $("#oqWall").innerHTML = q.showAnswers ? `<div class="sec">みんなの回答（${all.length}件・名前は表示されません）</div><div class="list">${all.map(([pid, a]) => `<div class="item"><div class="t">${pid === me.pid ? "<b>あなた：</b>" : ""}${esc(a.text)}</div></div>`).join("")}</div>` : "";
    }

    /* Q&A */
    $("#qSend").onclick = () => {
      const text = $("#qText").value.trim(); if (!text) return;
      DB.push(`${P}/questions`, { text, name: $("#qName").checked ? me.name : "", pid: me.pid, at: DB.now(), votes: {} });
      $("#qText").value = ""; toast("質問を送りました");
    };
    function renderQA() {
      const list = Object.entries(S.qs).filter(([, q]) => q && q.text).sort((a, b) => (!!a[1].done - !!b[1].done) || (Object.keys(b[1].votes || {}).length - Object.keys(a[1].votes || {}).length) || (b[1].at - a[1].at));
      $("#qList").innerHTML = list.length ? list.map(([id, q]) => {
        const v = q.votes || {}, mine = !!v[me.pid];
        return `<div class="item ${q.done ? "done" : ""}"><button data-vote="${id}" class="${mine ? "on" : ""}" style="min-width:52px">▲ ${Object.keys(v).length}</button>
          <div class="t">${esc(q.text)}<div class="small muted">${q.pid === me.pid ? "あなた・" : ""}${q.name ? esc(q.name) : "匿名"}${q.done ? "・回答済み" : ""}</div></div></div>`;
      }).join("") : `<div class="small muted">まだ質問はありません。最初の質問をどうぞ！</div>`;
      $$("[data-vote]").forEach(b => b.onclick = () => { const id = b.dataset.vote; const on = !!(S.qs[id].votes || {})[me.pid]; DB.set(`${P}/questions/${id}/votes/${me.pid}`, on ? null : true); });
    }

    /* memo */
    const memoKey = s => `classlive-memo-${code}-${s}`;
    function loadMemo() { const s = cur(); $("#memoTitle").textContent = `スライド ${s + 1} のメモ`; $("#memo").value = lsGet(memoKey(s), ""); $("#memo").dataset.s = s; $("#memoSaved").textContent = ""; }
    let memoT; $("#memo").oninput = () => { clearTimeout(memoT); memoT = setTimeout(() => { lsSet(memoKey(+$("#memo").dataset.s), $("#memo").value); $("#memoSaved").textContent = "保存しました"; }, 400); };
    $("#memoDl").onclick = () => {
      let out = `${meta.title}　メモ（${new Date().toLocaleDateString("ja-JP")}）\n\n`;
      for (let i = 0; i < meta.slideCount; i++) { const m = lsGet(memoKey(i), ""); if (m) out += `■ スライド ${i + 1}\n${m}\n\n`; }
      download(`${meta.title}_メモ.txt`, out);
    };

    /* subscriptions */
    function sub(name, path, cb) { S.unsub[name]?.(); S.unsub[name] = path ? DB.on(path, cb) : null; if (!path) cb(null); }
    let lastCall, lastPoll, lastOq;
    DB.on(P + "/state", v => {
      S.state = v || {};
      if (S.view != null && S.view === S.state.slide) S.view = null;
      if (S.view != null && S.view > (S.state.maxSlide || 0)) S.view = null;
      renderSlide();
      if (S.state.callId !== lastCall) { lastCall = S.state.callId; sub("call", lastCall && `${P}/calls/${lastCall}`, c => { S.call = c; onCall(lastCall, c); }); }
      if (S.state.pollId !== lastPoll) { lastPoll = S.state.pollId; S.answers = {}; sub("poll", lastPoll && `${P}/polls/${lastPoll}`, p => { S.poll = p; renderPoll(); }); sub("ans", lastPoll && `${P}/answers/${lastPoll}`, a => { S.answers = a || {}; renderPoll(); }); }
      if (S.state.oqId !== lastOq) { lastOq = S.state.oqId; S.oans = {}; S.oq = null; sub("oq", lastOq && `${P}/oqs/${lastOq}`, q => { S.oq = q; renderOQ(); }); sub("oans", lastOq && `${P}/oans/${lastOq}`, a => { S.oans = a || {}; renderOQ(); }); }
    });
    DB.on(P + "/questions", v => { S.qs = v || {}; renderQA(); });
    DB.on(P + "/meta", m => {
      if (m && m.ended) {
        $("#mini").innerHTML = `<div class="mini-banner"><span>📕 授業は終了しました。おつかれさまでした！</span><button id="endMemo" style="border:none">メモを保存</button></div>`;
        $("#endMemo").onclick = () => $("#memoDl").click();
      } else if ($("#endMemo")) $("#mini").innerHTML = "";
    });
    DB.on(`${P}/participants/${me.pid}/react`, r => { myReact = r; renderReact(); });
  }
}
async function sysNotify(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const opts = { body, tag: "classlive-call", renotify: true, requireInteraction: true, vibrate: [400, 150, 400, 150, 800], icon: "icon-192.png", data: { url: location.href } };
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) { await reg.showNotification(title, opts); return; } } catch (e) {}
  try { new Notification(title, opts); } catch (e) {}
}
</script>
</body>
</html>
